<div>
   <div class="card">
      <div class="card-header" style="padding: 5px 10px;">
         <div ng-if="!data.messages">
            <i class="fa fa-w subset"></i> Subsets ({{data.subsets.length}})
         </div>
         <div ng-if="data.messages.length>0">
            <i class="fa fa-w subset"></i> Subsets Deleted ({{data.subsetsDeleted.length}})
         </div>
      </div>
      <div class="card-body">
         <div ng-if="!data.messages" ng-repeat="subset in data.subsets track by $index">
            {{$index + 1}}.
            <i class="fa fa-fw subset"></i> {{subset.fqn}}
         </div>
         <div ng-if="data.messages.length>0" ng-repeat="item in data.messages track by $index">
            <div class="alert alert-{{item.class}}" role="alert" style="padding: 5px 10px">
               <i class="fa fa-w {{item.icon}}"></i> {{item.message}}
            </div>
         </div>
      </div>
   </div>
</div>
